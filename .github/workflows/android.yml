name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 📦 Step 1: Wipe workspace errors and initialize clean root parameters
      - name: Force Clean Workspace Structure
        run: |
          rm -rf app settings.gradle build.gradle gradle.properties
          mkdir -p app/src/main/java/com/footballanalysis/app
          mkdir -p app/src/main/res/layout
          echo "include ':app'" > settings.gradle

      # 🔧 Step 2: Inject build configurations with absolute lint protection
      - name: Generate Fresh build.gradle file
        run: |
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.footballanalysis.app'
              compileSdk 35

              defaultConfig {
                  applicationId "com.footballanalysis.app"
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

      # 📱 Step 3: Inject clean, official native manifest permissions
      - name: Inject Correct Android Manifest File
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Football Analysis"
                  android:roundIcon="@android:drawable/sym_def_app_icon"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      # 🧠 Step 4: Create a clean Full-Screen Web Engine Activity controller
      - name: Overwrite MainActivity with Web Engine
        run: |
          cat << 'EOF' > app/src/main/java/com/footballanalysis/app/MainActivity.java
          package com.footballanalysis.app;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  setContentView(webView);
                  
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("https://githack.com");
              }
          }
          EOF

      # ⚙️ Step 5: Force AndroidX configuration configurations
      - name: Force Enable AndroidX Support Everywhere
        run: |
          echo "android.useAndroidX=true" > gradle.properties

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 🛠️ Step 6: Setup a clean Gradle wrapper system architecture
      - name: Setup Gradle wrapper
        run: |
          gradle wrapper
          chmod +x gradlew

      # 🔐 Step 7: Automatically sign package components via keystore credentials
      - name: Generate Secure Keystore File
        run: |
          keytool -genkeypair -v \
            -keystore app/release-keystore.jks \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=FootballAnalysis, OU=Production, O=MobileApp, L=Nairobi, S=Nairobi, C=KE"

      # 🏗️ Step 8: Assemble signed distribution APK packages
      - name: Build Signed Release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release-keystore.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      # 📤 Step 9: Save compiled deployment artifacts securely
      - name: Upload Clean App Installer Package
        uses: actions/upload-artifact@v4
        with:
          name: Football-App-Verified
          path: app/build/outputs/apk/release/app-release.apk
