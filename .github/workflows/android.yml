name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 📦 Step 1: Extract your zip code safely
      - name: Unzip Project Archive
        run: |
          if [ -f "Football_Analysis_Android_V1.0_from_V2.30.zip" ]; then
            unzip -q Football_Analysis_Android_V1.0_from_V2.30.zip -d extracted_project
            cp -r extracted_project/* . 2>/dev/null || true
          fi

      # 🔧 Step 2: Overwrite the build.gradle file with a release configuration
      - name: Overwrite broken build.gradle file
        run: |
          mkdir -p app
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.footballanalysis.app'
              compileSdk 35

              defaultConfig {
                  applicationId "com.footballanalysis.app"
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

      # ⚙️ Step 3: Force AndroidX configuration everywhere
      - name: Force Enable AndroidX Support Everywhere
        run: |
          mkdir -p app
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.useAndroidX=true" > app/gradle.properties

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 🛠️ Step 4: Setup Gradle wrapper if missing
      - name: Setup Gradle wrapper if missing
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found. Generating a new one..."
            gradle wrapper
          fi
          chmod +x gradlew

      # 🔐 Step 5: Automatically generate a brand-new release keystore
      - name: Generate Secure Keystore File
        run: |
          keytool -genkeypair -v \
            -keystore app/release-keystore.jks \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=FootballAnalysis, OU=Production, O=MobileApp, L=Nairobi, S=Nairobi, C=KE"

      # 🏗️ Step 6: Compile and embed the newly generated keystore directly into the APK
      - name: Build Signed Release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release-keystore.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      # 📤 Step 7: Save and upload the verified package
      - name: Upload Verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Football-Analysis-Verified-APK
          path: |
            app/build/outputs/apk/release/app-release.apk
            **/build/outputs/apk/release/*.apk
