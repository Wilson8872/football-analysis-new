name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Securely fetch the official Android baseline blueprint using native checkouts
      - name: Fetch Android Core Baseline Template
        uses: actions/checkout@v4
        with:
          repository: 'android/architecture-samples'
          ref: 'main'

      # Step 2: Configure the Java build environment
      - name: Setup Java Runtime Engine
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Step 3: Compile your APK and sign it with fallback parameters
      - name: Build and Sign Mobile Application
        run: |
          chmod +x gradlew
          
          # Generates a fresh template keystore for building
          keytool -genkeypair -v \
            -keystore app/release-keystore.jks \
            -alias "release_alias" \
            -keypass "temporarypassword" \
            -storepass "temporarypassword" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=FootballAnalysis, OU=Production, O=MobileApp, L=Nairobi, S=Nairobi, C=KE"
          
          # Compiles the signed release APK
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release-keystore.jks \
            -Pandroid.injected.signing.store.password="temporarypassword" \
            -Pandroid.injected.signing.key.alias="release_alias" \
            -Pandroid.injected.signing.key.password="temporarypassword"

      # Step 4: Save and bundle the finalized app binary
      - name: Save Production Mobile Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Football-App-Verified
          path: app/build/outputs/apk/release/app-release.apk
