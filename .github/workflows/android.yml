name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Android Project Template
        run: |
          # Downloads a valid starter android project template since the repo is blank
          git clone https://github.com temp_project
          cp -r temp_project/* .
          rm -rf temp_project
          
          # Fix package names for Football Analysis
          find . -type f -name "*.gradle" -exec sed -i 's/com.example.android.architecture.blueprints/com.footballanalysis.app/g' {} +

      - name: Setup Java Runtime Engine
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build and Sign Mobile Application
        run: |
          chmod +x gradlew
          
          # Generates a temporary keystore for building
          keytool -genkeypair -v \
            -keystore app/release-keystore.jks \
            -alias "release_alias" \
            -keypass "temporarypassword" \
            -storepass "temporarypassword" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=FootballAnalysis, OU=Production, O=MobileApp, L=Nairobi, S=Nairobi, C=KE"
          
          # Compiles the signed release APK
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release-keystore.jks \
            -Pandroid.injected.signing.store.password="temporarypassword" \
            -Pandroid.injected.signing.key.alias="release_alias" \
            -Pandroid.injected.signing.key.password="temporarypassword"

      - name: Save Production Mobile Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Football-App-Verified
          path: app/build/outputs/apk/release/app-release.apk
