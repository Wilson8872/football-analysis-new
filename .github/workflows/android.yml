name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 📦 Step 1: Extract your zip code safely
      - name: Unzip Project Archive
        run: |
          if [ -f "Football_Analysis_Android_V1.0_from_V2.30.zip" ]; then
            unzip -q Football_Analysis_Android_V1.0_from_V2.30.zip -d extracted_project
            cp -r extracted_project/* . 2>/dev/null || true
          fi

      # ⚡ Step 2: Overwrite the broken file with a clean configuration
      - name: Overwrite broken build.gradle file
        run: |
          mkdir -p app
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.footballanalysis.app'
              compileSdk 35

              defaultConfig {
                  applicationId "com.footballanalysis.app"
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 🛠️ Step 3: Re-verify missing wrapper execution scripts
      - name: Setup Gradle wrapper if missing
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found. Generating a new one..."
            gradle wrapper
          fi
          chmod +x gradlew

      # 🏗️ Step 4: Compile APK
      - name: Build APK
        run: |
          ./gradlew assembleDebug

      # 📤 Step 5: Save and upload final package
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Football-Analysis-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            **/build/outputs/apk/**/*.apk
            
