name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 📦 Step 1: Extract your zip code safely
      - name: Unzip Project Archive
        run: |
          if [ -f "Football_Analysis_Android_V1.0_from_V2.30.zip" ]; then
            unzip -q Football_Analysis_Android_V1.0_from_V2.30.zip -d extracted_project
            cp -r extracted_project/* . 2>/dev/null || true
          fi

      # 🔧 Step 2: Overwrite build.gradle with production settings & auto-versioning
      - name: Overwrite broken build.gradle file
        run: |
          mkdir -p app
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.footballanalysis.app'
              compileSdk 35

              defaultConfig {
                  applicationId "com.footballanalysis.app"
                  minSdk 24
                  targetSdk 35
                  versionCode ${{ github.run_number }}
                  versionName "1.0.${{ github.run_number }}"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

      # 📱 Step 3: Inject an official, clean Android Manifest file
      - name: Inject Correct Android Manifest File
        run: |
          mkdir -p app/src/main
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Football Analysis"
                  android:roundIcon="@android:drawable/sym_def_app_icon"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

      # ⚽ Step 4: Inject the corrected Player Lineup XML layout
      - name: Inject Custom Player Lineup Grid Interface
        run: |
          mkdir -p app/src/main/res/layout
          cat << 'EOF' > app/src/main/res/layout/fragment_lineup.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout 
              xmlns:android="http://android.com"
              xmlns:app="http://android.com"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#1E281F">

              <TextView
                  android:id="@+id/tvFormationTitle"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Formation: 4-3-3 Attack"
                  android:textColor="#FFFFFF"
                  android:textSize="18sp"
                  android:textStyle="bold"
                  android:layout_marginTop="16dp"
                  app:layout_constraintTop_toTopOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent" />

              <GridLayout
                  android:id="@+id/glPlayerLineupGrid"
                  android:layout_width="0dp"
                  android:layout_height="0dp"
                  android:columnCount="2"
                  android:rowCount="2"
                  android:alignmentMode="alignBounds"
                  android:useDefaultMargins="true"
                  android:layout_margin="16dp"
                  app:layout_constraintTop_toBottomOf="@id/tvFormationTitle"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintStart_of="parent"
                  app:layout_constraintEnd_toEndOf="parent">

                  <LinearLayout
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:gravity="center"
                      android:layout_columnSpan="2"
                      android:layout_gravity="center_horizontal">
                      <ImageView
                          android:layout_width="48dp"
                          android:layout_height="48dp"
                          android:background="@android:drawable/btn_default"
                          android:contentDescription="GK" />
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="GK (1)"
                          android:textColor="#A0FFA0"
                          android:textStyle="bold" />
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_columnWeight="1"
                      android:orientation="vertical"
                      android:gravity="center">
                      <ImageView
                          android:layout_width="40dp"
                          android:layout_height="40dp"
                          android:background="@android:drawable/presence_online" />
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="LB (3)"
                          android:textColor="#FFFFFF"
                          android:textSize="12sp" />
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_columnWeight="1"
                      android:orientation="vertical"
                      android:gravity="center">
                      <ImageView
                          android:layout_width="40dp"
                          android:layout_height="40dp"
                          android:background="@android:drawable/presence_online" />
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="RB (2)"
                          android:textColor="#FFFFFF"
                          android:textSize="12sp" />
                  </LinearLayout>

              </GridLayout>

          </androidx.constraintlayout.widget.ConstraintLayout>
          EOF

      # 🧠 Step 5: Overwrite Main Activity code to launch the Lineup screen
      - name: Force MainActivity to display the Lineup UI
        run: |
          mkdir -p app/src/main/java/com/footballanalysis/app
          cat << 'EOF' > app/src/main/java/com/footballanalysis/app/MainActivity.java
          package com.footballanalysis.app;

          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.fragment_lineup);
              }
          }
          EOF

      # ⚙️ Step 6: Force AndroidX configuration everywhere
      - name: Force Enable AndroidX Support Everywhere
        run: |
          mkdir -p app
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.useAndroidX=true" > app/gradle.properties

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 🛠️ Step 7: Setup Gradle wrapper if missing
      - name: Setup Gradle wrapper if missing
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found. Generating a new one..."
            gradle wrapper
          fi
          chmod +x gradlew

      # 🔐 Step 8: Automatically generate release keystore passwords
      - name: Generate Secure Keystore File
        run: |
          keytool -genkeypair -v \
            -keystore app/release-keystore.jks \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=FootballAnalysis, OU=Production, O=MobileApp, L=Nairobi, S=Nairobi, C=KE"

      # 🏗️ Step 9: Compile and sign the APK package
      - name: Build Signed Release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release-keystore.jks \
