name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 📦 Step 1: Extract your zip code safely if present
      - name: Unzip Project Archive
        run: |
          if [ -f "Football_Analysis_Android_V1.0_from_V2.30.zip" ]; then
            unzip -q Football_Analysis_Android_V1.0_from_V2.30.zip -d extracted_project
            # Move the contents out to the root so gradle can read them
            cp -r extracted_project/* . 2>/dev/null || true
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 🛠️ Step 2: Dynamically create a missing gradlew file using the system's Gradle
      - name: Setup Gradle wrapper wrapper if missing
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found. Generating a new one..."
            gradle wrapper
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Football-Analysis-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            **/build/outputs/apk/**/*.apk
