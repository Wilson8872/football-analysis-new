name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your repository workspace safely
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Clear old project fragments to prevent layout collisions
      - name: Reset Workspace Parameters
        run: |
          rm -rf app settings.gradle build.gradle gradle.properties

      # Step 3: Fetch a verified, stable, high-performance compilation layout template
      - name: Clone Secure Compilation Matrix
        run: |
          git clone https://github.com temp_project
          cp -r temp_project/* .
          rm -rf temp_project

      # Step 4: Inject custom brand parameters into your mobile app configurations
      - name: Apply App Branding Values
        run: |
          sed -i 's/com.example.blueprint/com.footballanalysis.app/g' app/build.gradle
          sed -i 's/com.example.blueprint/com.footballanalysis.app/g' app/src/main/AndroidManifest.xml

      # Step 5: Configure stable Java engine parameters
      - name: Setup Java Runtime Engine
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 6: Make compiler execution tool files executable
      - name: Validate System Executables
        run: chmod +x gradlew

      # Step 7: Automatically generate cryptographic credentials and sign the app package
      - name: Compile and Secure Release Installer
        run: |
          keytool -genkeypair -v \
            -keystore app/release-keystore.jks \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=FootballAnalysis, OU=Production, O=MobileApp, L=Nairobi, S=Nairobi, C=KE"
            
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release-keystore.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      # Step 8: Push the completed app file to local storage for immediate download
      - name: Save Production Mobile Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Football-App-Verified
          path: app/build/outputs/apk/release/app-release.apk
