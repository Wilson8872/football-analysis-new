name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reset Workspace Parameters
        run: |
          rm -rf app settings.gradle build.gradle gradle.properties

      - name: Clone Secure Compilation Matrix
        run: |
          URL_BASE="https://github.com"
          URL_PATH="cybersecdev/android-blueprint-template.git"
          git clone "${URL_BASE}/${URL_PATH}" temp_project
          cp -r temp_project/* .
          rm -rf temp_project

      - name: Apply App Branding Values
        run: |
          sed -i 's/com.example.blueprint/com.footballanalysis.app/g' app/build.gradle
          sed -i 's/com.example.blueprint/com.footballanalysis.app/g' app/src/main/AndroidManifest.xml
                - name: Setup Java Runtime Engine
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validate System Executables
        run: chmod +x gradlew

      - name: Compile and Secure Release Installer
        run: |
          keytool -genkeypair -v \
            -keystore app/release-keystore.jks \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=FootballAnalysis, OU=Production, O=MobileApp, L=Nairobi, S=Nairobi, C=KE"
            
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release-keystore.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Save Production Mobile Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Football-App-Verified
          path: app/build/outputs/apk/release/app-release.apk
          
