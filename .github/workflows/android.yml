name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Force Clean Workspace Structure
        run: |
          rm -rf app settings.gradle build.gradle gradle.properties
          mkdir -p app/src/main/java/com/footballanalysis/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

      - name: Create settings.gradle
        run: |
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Football Analysis New"
          include ':app'
          EOF

      - name: Create gradle.properties
        run: |
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          EOF

      - name: Create app/build.gradle
        run: |
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2'
          }

          android {
              namespace 'com.footballanalysis.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.footballanalysis.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

      - name: Create app/src/main/AndroidManifest.xml
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Football Analysis"
                  android:roundIcon="@android:drawable/sym_def_app_icon"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.FootballAnalysis">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Create app/src/main/res/values/themes.xml
        run: |
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.FootballAnalysis" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">#1E281F</item>
                  <item name="colorSecondary">#A0FFA0</item>
                  <item name="android:statusBarColor">#1E281F</item>
              </style>
          </resources>
          EOF

      - name: Create app/src/main/res/layout/activity_main.xml
        run: |
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout 
              xmlns:android="http://android.com"
              xmlns:app="http://android.com"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#1E281F">

              <TextView
                  android:id="@+id/tvFormationTitle"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Formation: 4-3-3 Attack"
                  android:textColor="#FFFFFF"
                  android:textSize="20sp"
                  android:textStyle="bold"
                  android:layout_marginTop="24dp"
                  app:layout_constraintTop_toTopOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent" />

              <GridLayout
                  android:id="@+id/glPlayerLineupGrid"
                  android:layout_width="0dp"
                  android:layout_height="0dp"
                  android:columnCount="1"
                  android:rowCount="3"
                  android:useDefaultMargins="true"
                  android:layout_margin="24dp"
                  app:layout_constraintTop_toBottomOf="@id/tvFormationTitle"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintStart_of="parent"
                  app:layout_constraintEnd_toEndOf="parent">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:gravity="center"
                      android:layout_rowWeight="1">
                      <ImageView
                          android:layout_width="56dp"
                          android:layout_height="56dp"
                          android:background="@android:drawable/btn_default" />
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="GK (1)"
                          android:textColor="#A0FFA0"
                          android:textStyle="bold"
                          android:textSize="14sp" />
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:gravity="center"
                      android:layout_rowWeight="1">
                      <ImageView
                          android:layout_width="48dp"
                          android:layout_height="48dp"
                          android:background="@android:drawable/presence_online" />
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="LB (3)"
                          android:textColor="#FFFFFF"
                          android:textSize="13sp" />
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:gravity="center"
                      android:layout_rowWeight="1">
                      <ImageView
                          android:layout_width="48dp"
                          android:layout_height="48dp"
                          android:background="@android:drawable/presence_online" />
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="RB (2)"
                          android:textColor="#FFFFFF"
                          android:textSize="13sp" />
                  </LinearLayout>

              </GridLayout>

          </androidx.constraintlayout.widget.ConstraintLayout>
          EOF

      - name: Create app/src/main/java/com/footballanalysis/app/MainActivity.java
        run: |
          cat << 'EOF' > app/src/main/java/com/footballanalysis/app/MainActivity.java
          package com.footballanalysis.app;

          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
              }
          }
          EOF

      - name: Set up Java Environment
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Wrapper Environment
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Generate Keystore and Build Signed Release APK
        run: |
          keytool -genkeypair -v \
            -keystore app/release-keystore.jks \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=FootballAnalysis, OU=Production, O=MobileApp, L=Nairobi, S=Nairobi, C=KE"
            
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release-keystore.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Upload Verified App Package
        uses: actions/upload-artifact@v4
        with:
          name: Football-App-Verified
          path: app/build/outputs/apk/release/app-release.apk
          
